name: CI/CD

on:
  push:
    branches: [main]
    # Docs-only changes don't need a redeploy. Not applied to pull_request:
    # `check` is a required status, and a skipped run would block the merge
    paths-ignore:
      - "**.md"
  pull_request:

# One run per branch; a newer push to a PR cancels the stale run,
# while deploys to main are queued instead of interrupted mid-way
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm

      - run: npm install --global vercel@62.1.0

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          COMMIT_SHA: ${{ github.sha }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Smoke test
        run: |
          for _ in $(seq 1 10); do
            if curl -fsS "$PRODUCTION_URL/api/health" | grep -q "$GITHUB_SHA"; then
              echo "Commit $GITHUB_SHA is live"
              exit 0
            fi
            sleep 6
          done
          echo "::error::$PRODUCTION_URL/api/health does not report commit $GITHUB_SHA"
          exit 1
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
